<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18213b"/>
      <stop offset="0.55" stop-color="#0d1326"/>
      <stop offset="1" stop-color="#080b16"/>
    </linearGradient>
    <linearGradient id="tileTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4d86"/>
      <stop offset="1" stop-color="#2b3866"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff3b4d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff3b4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d5e"/>
      <stop offset="1" stop-color="#e01e30"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="squircle">
      <rect x="92" y="92" width="840" height="840" rx="196" ry="196"/>
    </clipPath>
  </defs>

  <!-- squircle background -->
  <g clip-path="url(#squircle)">
    <rect x="92" y="92" width="840" height="840" fill="url(#bg)"/>
    <!-- subtle top sheen -->
    <ellipse cx="512" cy="150" rx="520" ry="220" fill="#ffffff" opacity="0.05"/>
    <!-- faint floor grid lines -->
    <g stroke="#33427a" stroke-width="3" opacity="0.18">
      <line x1="150" y1="720" x2="874" y2="720"/>
      <line x1="180" y1="790" x2="844" y2="790"/>
    </g>

    <!-- red glow behind the flag -->
    <circle cx="600" cy="470" r="240" fill="url(#glow)"/>

    <!-- ground shadow -->
    <ellipse cx="512" cy="690" rx="300" ry="80" fill="#000000" opacity="0.35" filter="url(#soft)"/>

    <!-- isometric platform tile -->
    <!-- side faces -->
    <path d="M 322 640 L 512 735 L 512 815 L 322 720 Z" fill="#1b2444"/>
    <path d="M 512 735 L 702 640 L 702 720 L 512 815 Z" fill="#141b36"/>
    <!-- top face -->
    <path d="M 512 545 L 702 640 L 512 735 L 322 640 Z" fill="url(#tileTop)" stroke="#46599b" stroke-width="4"/>

    <!-- glowing divergence ring on the tile -->
    <ellipse cx="566" cy="648" rx="92" ry="44" fill="none" stroke="#ff3b4d" stroke-width="16" opacity="0.9"/>
    <ellipse cx="566" cy="648" rx="92" ry="44" fill="none" stroke="#ff6b78" stroke-width="6"/>

    <!-- flag pole -->
    <rect x="558" y="320" width="16" height="330" rx="8" fill="#dfe4f0"/>
    <circle cx="566" cy="320" r="13" fill="#f2f5fb"/>
    <!-- waving red flag -->
    <path d="M 574 330 Q 660 305 716 345 Q 700 405 760 430 L 574 452 Z" fill="url(#flag)"/>

    <!-- pointer character standing on the tile -->
    <g transform="translate(430 590)">
      <ellipse cx="0" cy="78" rx="40" ry="14" fill="#000000" opacity="0.3"/>
      <rect x="-26" y="0" width="52" height="70" rx="26" fill="#ffb454"/>
      <circle cx="0" cy="-18" r="30" fill="#ffc16e"/>
    </g>
  </g>
</svg>
