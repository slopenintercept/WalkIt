<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Walk It — see your code break</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚩</text></svg>"
    />
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
    <style>
      /* branded splash shown until React mounts — avoids a white flash on launch */
      html,
      body {
        margin: 0;
        background: #0b0e1a;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(circle at 50% 38%, #161d33 0%, #0b0e1a 70%);
        color: #e8ecf4;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #splash .logo {
        font-size: 40px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      #splash .sub {
        font-size: 14px;
        color: #8fa3d0;
      }
      #splash .bar {
        margin-top: 6px;
        width: 180px;
        height: 4px;
        border-radius: 4px;
        background: #1f2742;
        overflow: hidden;
      }
      #splash .bar::after {
        content: "";
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 4px;
        background: #ff3b4d;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="logo">🚩 Walk It</div>
      <div class="sub">see your code break</div>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
